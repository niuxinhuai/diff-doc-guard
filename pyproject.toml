[project]
name = "diff-doc-guard"
version = "0.1.0"
description = "Generate documentation sync checklists from git diffs."
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [{ name = "Diff Doc Guard contributors" }]
keywords = ["ai", "documentation", "git-diff", "ci", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/niuxinhuai/diff-doc-guard"
Repository = "https://github.com/niuxinhuai/diff-doc-guard"
Issues = "https://github.com/niuxinhuai/diff-doc-guard/issues"

[project.scripts]
diff-doc-guard = "diff_doc_guard.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
